spring:
  application:
    name: repayment-backend
  config:
    # docker-compose.yml과 같은 .env를 읽는다. 없으면(CI·테스트) 무시되고 아래 기본값이 쓰인다.
    import: optional:file:.env[.properties]
  profiles:
    default: local
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3306}/${MYSQL_DATABASE:repayment}?connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:repayment}
    password: ${MYSQL_PASSWORD:}
  flyway:
    enabled: true
    baseline-on-migrate: true
    # 테이블이 이미 있는 DB에 처음 붙으면 V0을 적용된 것으로 본다. 빈 DB는 V0부터 실행한다.
    baseline-version: 0
    # 공통(운영 포함)은 스키마만. 샘플 데이터는 프로필별 파일에서 location을 추가한다.
    locations: classpath:db/migration
  batch:
    jdbc:
      # 메타 테이블은 Flyway(V2__spring_batch_schema.sql)가 만든다.
      initialize-schema: never
    job:
      # 기동 시 Job을 자동 실행하지 않는다.
      enabled: false

bok:
  api:
    base-url: https://ecos.bok.or.kr/api
    # 한국은행 ECOS 인증키. .env의 BOK_API_KEY에서 읽는다 (커밋하지 않는다).
    auth-key: ${BOK_API_KEY:}

repayment:
  # 상환 금액이 입금되는 은행 수납 계좌. 환경마다 이 계좌번호로 account 행을 둔다.
  collection-account-no: 100-000-000001
  # 대출을 개설할 때 대출금이 출금되는 은행 지급 계좌.
  disbursement-account-no: 100-000-000002

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  # 코드성 enum ↔ id 변환 (CodeEnumTypeHandler)
  type-handlers-package: com.repayment.global.config.typehandler
  configuration:
    map-underscore-to-camel-case: true
