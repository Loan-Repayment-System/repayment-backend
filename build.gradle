plugins {
    id 'java'
    id 'jacoco'
    id 'info.solidsoft.pitest' version '1.15.0'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.repayment'
version = '0.0.1-SNAPSHOT'
description = '대출 상환 시스템 백엔드'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.batch:spring-batch-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.5'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// DB(docker compose)와 JDBC URL을 KST로 맞췄으므로 JVM도 KST로 고정한다.
def timezoneJvmArg = '-Duser.timezone=Asia/Seoul'

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs timezoneJvmArg
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
    reports {
        xml.required = false
        csv.required = true
        html.required = true
    }
}

tasks.named('bootRun') {
    jvmArgs timezoneJvmArg
}

// 상환금 산정 로직(대출 스케줄 판정·대출 상태 판정·상태 변화에 따른 처리)만 변이시키고, 단위 테스트로만 잡는다.
pitest {
    pitestVersion = '1.17.0'
    junit5PluginVersion = '1.2.1'
    targetClasses = [
            'com.repayment.domain.schedule.service.RepaymentAmountCalculator',
            'com.repayment.domain.schedule.service.AppliedRateService',
            'com.repayment.domain.schedule.service.RepaymentScheduleConfirmService',
            'com.repayment.domain.schedule.service.RepaymentScheduleJudge',
            'com.repayment.domain.schedule.service.RepaymentScheduleJudgmentService',
            'com.repayment.domain.loan.service.LoanPayoffService',
            'com.repayment.domain.loan.service.LoanStatusJudge',
            'com.repayment.domain.loan.service.LoanStatusJudgmentService',
            'com.repayment.domain.delinquency.service.DelinquencyChargeCalculator',
            'com.repayment.domain.loan.service.LoanStatusUpdateService',
            'com.repayment.domain.delinquency.service.InstallmentDelinquencyChargeService',
            'com.repayment.domain.acceleration.service.AccelerationConversionService',
            'com.repayment.domain.acceleration.service.AccelerationDailyChargeService',
            'com.repayment.domain.maturity.service.MaturityOverdueConversionService',
            'com.repayment.domain.maturity.service.MaturityOverdueDailyChargeService',
            'com.repayment.domain.loan.service.LoanStatusChangeService'
    ]
    targetTests = ['com.repayment.domain.*']
    excludedTestClasses = ['*IntegrationTest']
    jvmArgs = [timezoneJvmArg]
    mutators = ['ALL']
    threads = 4
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
}
